<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Variável Global</h1>
    <input type="text" id="txtNum" value="0">
    <br>
    <input type="button" value="+" id="mais">
    <input type="button" value="-" id="menos">
    <input type="button" value="Set" id="set">
    <input type="button" value="Clear" id="limpa">
    <script>
        mais.addEventListener("click", inc);
        menos.addEventListener("click", dec);
        set.addEventListener("click", setNum);
        limpa.addEventListener("click", clearNum);
        let num = 0;

        function setNum() {
            num = prompt("Digite o número: ");
            if (num !== null) {
                num = parseInt(num);
                if (!isNaN(num)) {
                    txtNum.value = num;
                }
            }
        }
        function inc() {
            num++;
            txtNum.value = num;
        }
        function dec() {
            num--;
            txtNum.value = num;
        }
        function clearNum() {
            num = 0;
            txtNum.value = num;
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #000;
            color: #fff;
        }
        input {
            padding: 10px 20px;
            margin: 10px;
            font-size: 20px;
            cursor: pointer;
            background-color: #fff;
            color: #000;
            border-radius: 40px;
        }
        #txtNum {
            width: 100px;
            font-size: 24px;
            text-align: center;
        }
    </style>
</body>
</html>
