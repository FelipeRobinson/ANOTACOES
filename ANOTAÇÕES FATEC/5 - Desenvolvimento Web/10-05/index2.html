<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <h1>Calculadora Simples</h1>
    Valor 1: <input type="text" id="v1" value="0"><br>
    Valor 2: <input type="text" id="v2" value="0"><br>
    Operação:
    <select id="op">
        <option value="">Escolha uma opção: </option>
        <option value="+">Somar</option>
        <option value="-">Subtrair</option>
        <option value="*">Multiplicar</option>
        <option value="/">Dividir</option>
    </select>
    <input type="button" value="Calcular" id="btCalc"><br>
    Resultado: <input type="text" id="res" value="0" readonly>

    <script>
        btCalc.addEventListener("click", function() {
            if(op.value == '+') {
                res.value = parseFloat(v1.value) + parseFloat(v2.value);
            }
            else if (op.value == '-') {
                res.value = parseFloat(v1.value) - parseFloat(v2.value);
            }
            else if (op.value == '*') {
                res.value = parseFloat(v1.value) * parseFloat(v2.value);
            }
            else if (op.value == '/') {
                res.value = parseFloat(v1.value) / parseFloat(v2.value);
            }
            else {
                alert("ERROR!")
                alert("Escolha uma opção!")
            }
        });
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #000;
            color: #fff;
            padding-left: 10px;
            line-height: 2.5;
        }
        input {
            border-radius: 20px;
            border: none;
        }
    </style>
</body>
</html>
