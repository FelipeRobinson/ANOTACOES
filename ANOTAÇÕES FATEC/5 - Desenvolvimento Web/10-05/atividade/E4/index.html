<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Dados</title>
</head>
<body>
    <!--
        4. Considerando um dado de jogo sendo lançado uma determinada quantidade de vezes, informada pelo
        usuário, mostrar uma imagem correspondendo a cada lançamento e, ao final, um relatório indicando quantas
        vezes e a porcentagem de cada lado sorteado.
    -->
    <h1>Dados</h1>
    <p>Lançamentos de dados.</p>
    <p id="lançamentos"></p>
    <input type="number" id="quantidade">
    <button id="iniciar">Lançar</button>
    <button id="limpar">Limpar</button>
    <div id="resultados"></div>

    <script>
        btIniciar = document.getElementById("iniciar");
        btLimpar = document.getElementById("limpar");
        exResultados = document.getElementById("resultados");

        btIniciar.addEventListener("click", function () {
            if (exResultados.childElementCount > 0) {
                alert("Os dados já foram lançados. Use Limpar para fazer outro lançamento.");
                return;
            }

            const quantidade = document.getElementById("quantidade").value;

            for (let i = 0; i < quantidade; i++) {
                const numero = Math.floor(Math.random() * 6) + 1;
                const img = document.createElement("img");
                img.src = `./img/dado${numero}.jpg`;
                exResultados.appendChild(img);
            }
        });

        btLimpar.addEventListener("click", function(){
            exResultados.innerHTML = "";
        });
    </script>
</body>
</html>
