<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>DADOS</title>
</head>
<body>
    <!--
        4. Considerando um dado de jogo sendo lançado uma determinada quantidade de vezes, informada pelo
        usuário, mostrar uma imagem correspondendo a cada lançamento e, ao final, um relatório indicando quantas
        vezes e a porcentagem de cada lado sorteado.
    -->
    <h1>Dados</h1>
    <p>Lançamentos de dados.</p>
    <p id="lançamentos"></p>
    <input type="number" id="quantidade">
    <button id="iniciar">Lançar</button>
    <button id="limpar">Limpar</button>
    <div id="relatorio"></div>
    <div id="resultados"></div>

    <script src="./script.js"></script>
</body>
</html>
