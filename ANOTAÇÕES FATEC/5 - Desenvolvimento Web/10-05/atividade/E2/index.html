<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>FATORIAL</title>
</head>
<body>
    <!-- 
    2. Considerando um número inteiro digitado pelo usuário, calcular e exibir o valor da sua fatorial em uma
    página Web. Por exemplo, se o usuário digitar 4, temos que a fatorial é 4 x 3 x 2 x 1, isto é, 24. O resultado
    deverá ser exibido na cor verde, centralizado e em itálico. Realizar todas as formatações usando apenas CSS
    externo.
    -->
    
    <h1>FATORIAL</h1>
    <p>Como o fatorial é calculado: </p>
    <p>N! = N * (N-1) * (N-2) * ... * 2 * 1</p>
    <p>Digite seu número: </p>
    <input type="number" step="1" id="numero">
    <button id="calcular">Calcular</button>
    <h2 id="resultado"></h2>

    <script src="./script.js"></script>
</body>
</html>
