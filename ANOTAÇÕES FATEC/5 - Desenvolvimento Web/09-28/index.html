    <h1>CARA OU COROA</h1>
    <input type="button" value="Sortear" id="btSortear">
    <input type="button" value="Limpar" id="btLimpar">
    <div id="cara"></div>
    <div id="coroa"></div>
    <div id="total"></div>
    <div id="area"></div>

    <script>
        let caras = 0;
        let coroas = 0;
        let porcentoCARA = 0;
        let porcentoCOROA = 0;

        btSortear.addEventListener('click', function() {
            let face = Math.floor(Math.random() * 2);
            let moeda = new Array('./img/moeda_1.jpg', './img/moeda_2.jpg');
            area.innerHTML += '<img src="' + moeda[face] + '">';

            if (face == 0) {
                caras++;
                porcentoCARA = (caras / (caras + coroas)) * 100;
                cara.innerHTML = 'Cara: ' + caras + ' (' + porcentoCARA.toFixed(2) + '%)';
            }
            else {
                coroas++;
                porcentoCOROA = (coroas / (caras + coroas)) * 100;
                coroa.innerHTML = 'Coroa: ' + coroas + ' (' + porcentoCOROA.toFixed(2) + '%)';
            }

            total.innerHTML = 'Total: ' + (caras + coroas);
        });

        btLimpar.addEventListener('click', function() {
            caras = 0;
            coroas = 0;
            porcentoCARA = 0;
            porcentoCOROA = 0;
            cara.innerHTML = '';
            coroa.innerHTML = '';
            total.innerHTML = '';
            area.innerHTML = '';
        });
    </script>
    <style>
        body {
            background-color: #000;
            color: #fff;
        }
        img {
            height: 64px;
        }
    </style>
